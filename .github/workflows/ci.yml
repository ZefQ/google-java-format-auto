name: Build, Test, Package & Release VS Code Extension

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version att publicera (t.ex. 0.1.0)"
        required: true
      publish_marketplace:
        description: "Publicera till Marketplace också?"
        type: boolean
        default: false

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Compile TypeScript
        run: pnpm exec tsc --skipLibCheck

      - name: Run tests headless
        run: xvfb-run -a pnpm test

      - name: Package extension (.vsix)
        run: pnpm vsce package --no-dependencies

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: google-java-format-auto
          path: "*.vsix"

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download packaged VSIX
        uses: actions/download-artifact@v4
        with:
          name: google-java-format-auto
          path: .

      - name: Create GitHub Tag
        id: create_tag
        run: |
          VERSION="v${{ github.event.inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          files: "*.vsix"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to VS Code Marketplace
        if: ${{ github.event.inputs.publish_marketplace == 'true' }}
        run: pnpm vsce publish -p ${{ secrets.VSCE_TOKEN }}
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
